name: apex_speech
description: Virtual AI Public Speaking Coach - Production MVP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0

  # Audio
  record: ^5.0.4
  just_audio: ^0.9.36
  path_provider: ^2.1.2
  permission_handler: ^11.3.0

  # UI
  google_fonts: ^6.1.0
  glassmorphism: ^3.0.0
  lottie: ^3.0.0
  flutter_animate: ^4.5.0

  # Utils
  uuid: ^4.3.3
  intl: ^0.18.1
  equatable: ^2.0.5
  get_it: ^7.6.7
  injectable: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
